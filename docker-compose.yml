services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mdpathlabs
      POSTGRES_PASSWORD: mdpathlabs
      POSTGRES_DB: mdpathlabs
    ports:
      - "5433:5432"
    volumes:
      - mdpathlabs_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  mdpathlabs_pg_data:
